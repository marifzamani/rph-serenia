<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPH Serenia</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b3fa0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RPH Serenia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --p:#5b3fa0; --p2:#ede7f8; --bg:#f6f4fb; --card:#fff; --tx:#222; --mu:#777; --bd:#e3dcf2;
          --ok:#1f8a4c; --ok2:#dff3e7; --no:#c62f2f; --no2:#fbe1e1; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--tx); }
  header { background:var(--p); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  main { padding:16px; max-width:820px; margin:0 auto; }
  .crumb { color:var(--mu); font-size:14px; margin-bottom:12px; }
  .msg { text-align:center; color:var(--mu); padding:40px 0; }
  .wrap { max-width:520px; margin:0 auto; }

  /* Menu muka depan */
  .tabs { display:flex; gap:6px; background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:4px; margin-bottom:12px; }
  .tabs button { flex:1; border:0; background:transparent; padding:10px 6px; border-radius:9px; font-size:14px; font-weight:600; color:var(--mu); cursor:pointer; }
  .tabs button.on { background:var(--p); color:#fff; }

  /* Kalendar */
  .cal { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:12px; }
  .calhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .calhead h2 { flex:1; text-align:center; font-size:18px; margin:0; }
  .calhead button { background:var(--p2); color:var(--p); border:0; border-radius:8px; width:40px; height:36px; font-size:18px; cursor:pointer; }
  .calhead button:disabled { opacity:.35; cursor:default; }
  select { border:1px solid var(--bd); border-radius:8px; padding:6px; font-size:14px; background:#fff; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .dow { text-align:center; font-size:12px; color:var(--mu); padding:4px 0; font-weight:600; }
  .day { aspect-ratio:1/1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:15px; color:#bbb; min-height:40px; }
  .day.has { background:var(--p2); color:var(--p); font-weight:700; cursor:pointer; }
  .day.has:hover { background:var(--p); color:#fff; }
  .day.ok { background:var(--ok2); color:var(--ok); font-weight:700; cursor:pointer; }
  .day.no { background:var(--no2); color:var(--no); font-weight:700; }
  .day.today { outline:2px solid var(--p); }
  .day small { font-size:10px; font-weight:600; margin-top:2px; }
  .summary { margin-top:12px; font-size:13px; color:var(--mu); text-align:center; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px; font-size:12px; color:var(--mu); }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; }

  /* Kad rumusan */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:10px; text-align:center; }
  .stat b { display:block; font-size:24px; }
  .stat span { font-size:12px; color:var(--mu); }
  .stat.ok b { color:var(--ok); } .stat.no b { color:var(--no); }
  .note { font-size:12px; color:var(--mu); margin:10px 2px 0; }
  h3 { font-size:15px; margin:18px 2px 8px; }

  .list { display:grid; gap:8px; }
  .item { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:12px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .item:hover { border-color:var(--p); }
  .item.static { cursor:default; }
  .item .sub { color:var(--mu); font-size:12px; margin-top:2px; }
  .badge { background:var(--bg); color:var(--p); border-radius:999px; padding:2px 10px; font-size:13px; font-weight:600; white-space:nowrap; }
  .badge.no { background:var(--no2); color:var(--no); }
  .badge.ok { background:var(--ok2); color:var(--ok); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--no2); color:var(--no); border-radius:999px; padding:4px 10px; font-size:13px; font-weight:600; }
  input[type=search] { width:100%; padding:10px 12px; border:1px solid var(--bd); border-radius:10px; font-size:15px; margin-bottom:10px; }

  .entry { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:4px 14px; margin-bottom:14px; }
  .f { padding:10px 0; border-bottom:1px solid var(--bd); }
  .f:last-child { border-bottom:0; }
  .f b { display:block; font-size:12px; color:var(--p); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px; }
  .f div { white-space:pre-wrap; word-break:break-word; }
  .f a { color:var(--p); }
</style>
</head>
<body>
<header>
  <button id="back" style="display:none" onclick="goBack()">← Kembali</button>
  <h1 id="title">Semakan RPH Serenia</h1>
  <button onclick="load(true)">Muat semula</button>
</header>
<main id="app"><div class="msg">Memuatkan data…</div></main>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbzkxqxU8pgN0Zn_H2vbOsGvcuz9bJ3fuDuAAzoeOfglRYpEa3O4d4G3gxsypBbXRBNn/exec';
  // Hari persekolahan: 1=Isnin ... 5=Jumaat (0=Ahad, 6=Sabtu)
  var HARI_SEKOLAH = [1,2,3,4,5];
  var BULAN = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
  var HARI = ['Isn','Sel','Rab','Kha','Jum','Sab','Ahd'];

  var SUM = null, MONTHS = [], GURU = [], DETAIL = {};
  var view = { v:'home' }, stack = [], tab = 'cal', ym = null, q = '';
  var app = document.getElementById('app');

  function api(qs){
    return fetch(API + '?' + qs + '&t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.error) throw new Error(d.error); return d;
    });
  }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s,]+)/g,'<a href="$1" target="_blank">$1</a>'); }
  function pad(n){ return (n<10?'0':'')+n; }
  function niceDate(k){ var p=k.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  function dayName(k){ var p=k.split('-'); return ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'][new Date(+p[0],+p[1]-1,+p[2]).getDay()]; }
  function todayKey(){ var t=new Date(); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
  function monthLabel(m){ return BULAN[+m.slice(5,7)-1]+' '+m.slice(0,4); }
  function err(e){ app.innerHTML = '<div class="msg">Ralat: '+esc(e && e.message || e)+'</div>'; }

  function load(force){
    app.innerHTML = '<div class="msg">Memuatkan data…</div>';
    if (force) DETAIL = {};
    api('api=summary' + (force ? '&force=1' : '')).then(function(d){
      SUM = d;
      var mset = {}, gset = {};
      Object.keys(SUM).forEach(function(k){
        mset[k.slice(0,7)] = 1;
        Object.keys(SUM[k]).forEach(function(g){ gset[g] = 1; });
      });
      MONTHS = Object.keys(mset).sort();
      GURU = Object.keys(gset).sort();
      if (!ym || MONTHS.indexOf(ym) < 0) {
        var cur = todayKey().slice(0,7);
        ym = MONTHS.indexOf(cur) >= 0 ? cur : MONTHS[MONTHS.length-1];
      }
      render();
    }).catch(err);
  }

  // ---------- navigasi ----------
  function go(v){ stack.push(view); view = v; render(); window.scrollTo(0,0); }
  function goBack(){ view = stack.pop() || { v:'home' }; render(); }
  function setTab(t){ tab = t; render(); }
  function shift(n){ var i = MONTHS.indexOf(ym)+n; if (i>=0 && i<MONTHS.length) { ym = MONTHS[i]; render(); } }
  function setMonth(m){ ym = m; render(); }

  function render(){
    if (!SUM) return;
    document.getElementById('back').style.display = view.v === 'home' ? 'none' : '';
    if (view.v === 'home') return tab === 'cal' ? renderHomeCal() : renderGuruList();
    if (view.v === 'gurus') return renderGurus();
    if (view.v === 'report') return renderReport();
    renderDetail();
  }

  function tabsHtml(){
    return '<div class="tabs wrap">'
      + '<button class="'+(tab==='cal'?'on':'')+'" onclick="setTab(\'cal\')">Kalendar RPH</button>'
      + '<button class="'+(tab==='guru'?'on':'')+'" onclick="setTab(\'guru\')">Laporan RPH Guru</button></div>';
  }

  function monthHead(){
    var idx = MONTHS.indexOf(ym);
    var opts = MONTHS.slice().reverse().map(function(m){
      return '<option value="'+m+'"'+(m===ym?' selected':'')+'>'+monthLabel(m)+'</option>';
    }).join('');
    return '<div class="calhead">'
      + '<button onclick="shift(-1)" '+(idx<=0?'disabled':'')+'>‹</button>'
      + '<h2>'+monthLabel(ym)+'</h2>'
      + '<button onclick="shift(1)" '+(idx>=MONTHS.length-1?'disabled':'')+'>›</button>'
      + '</div><div style="text-align:center;margin-bottom:10px"><select onchange="setMonth(this.value)">'+opts+'</select></div>';
  }

  // Bina grid kalendar; cellFn(key, dayNum) -> html sel
  function gridHtml(cellFn){
    var y = +ym.slice(0,4), m = +ym.slice(5,7);
    var lead = (new Date(y, m-1, 1).getDay() + 6) % 7, days = new Date(y, m, 0).getDate();
    var html = '<div class="grid">';
    HARI.forEach(function(h){ html += '<div class="dow">'+h+'</div>'; });
    for (var i=0;i<lead;i++) html += '<div></div>';
    for (var d=1; d<=days; d++) html += cellFn(ym+'-'+pad(d), d);
    return html + '</div>';
  }

  // Hari sekolah = hari persekolahan (Isn–Jum) yang sudah berlalu dan ada sekurang-kurangnya seorang guru hantar RPH
  function schoolDays(month){
    var y = +month.slice(0,4), m = +month.slice(5,7), days = new Date(y, m, 0).getDate(), tk = todayKey(), out = [];
    for (var d=1; d<=days; d++) {
      var k = month+'-'+pad(d);
      if (k > tk) break;
      if (HARI_SEKOLAH.indexOf(new Date(y, m-1, d).getDay()) < 0) continue;
      if (SUM[k]) out.push(k);
    }
    return out;
  }

  function guruStats(g, month){
    var sd = schoolDays(month), sent = [], miss = [], rph = 0;
    sd.forEach(function(k){
      if (SUM[k][g]) { sent.push(k); } else { miss.push(k); }
    });
    Object.keys(SUM).forEach(function(k){ if (k.slice(0,7) === month && SUM[k][g]) rph += SUM[k][g].length; });
    return { sd:sd, sent:sent, miss:miss, rph:rph };
  }

  // ---------- Kalendar RPH (semua guru) ----------
  function renderHomeCal(){
    document.getElementById('title').textContent = 'Semakan RPH Serenia';
    if (!ym) { app.innerHTML = tabsHtml() + '<div class="msg">Tiada data.</div>'; return; }
    var tk = todayKey(), totRph = 0, totDays = 0;
    var grid = gridHtml(function(k, d){
      var day = SUM[k], cls = 'day' + (day?' has':'') + (k===tk?' today':'');
      if (!day) return '<div class="'+cls+'">'+d+'</div>';
      var n = 0; Object.keys(day).forEach(function(g){ n += day[g].length; });
      totRph += n; totDays++;
      return '<div class="'+cls+'" onclick="go({v:\'gurus\',key:\''+k+'\'})">'+d+'<small>'+n+' RPH</small></div>';
    });
    app.innerHTML = tabsHtml() + '<div class="cal wrap">' + monthHead() + grid
      + '<div class="summary">'+totDays+' hari ada RPH · '+totRph+' RPH bulan ini</div></div>';
  }

  // ---------- Laporan RPH Guru: senarai guru ----------
  function renderGuruList(){
    document.getElementById('title').textContent = 'Semakan RPH Serenia';
    var sdCount = schoolDays(ym).length;
    var html = tabsHtml() + '<div class="wrap"><div class="cal" style="padding-bottom:4px">' + monthHead() + '</div>'
      + '<p class="note">'+sdCount+' hari sekolah setakat ini dalam '+monthLabel(ym)+'. Tekan nama guru untuk laporan penuh.</p>'
      + '<input type="search" placeholder="Cari nama guru" value="'+esc(q)+'" oninput="q=this.value;renderGuruRows()" style="margin-top:10px">'
      + '<div class="list" id="gl"></div></div>';
    app.innerHTML = html;
    renderGuruRows();
  }

  function renderGuruRows(){
    var el = document.getElementById('gl'); if (!el) return;
    var qq = q.toLowerCase(), html = '';
    var rows = GURU.filter(function(g){ return !qq || g.toLowerCase().indexOf(qq) >= 0; }).map(function(g){
      return { g:g, s:guruStats(g, ym) };
    });
    rows.sort(function(a,b){ return b.s.miss.length - a.s.miss.length || a.g.localeCompare(b.g); });
    rows.forEach(function(r, i){
      var miss = r.s.miss.length;
      html += '<div class="item" onclick="openReport('+GURU.indexOf(r.g)+')"><div><div>'+esc(r.g)+'</div>'
        + '<div class="sub">'+r.s.sent.length+'/'+r.s.sd.length+' hari hantar · '+r.s.rph+' RPH</div></div>'
        + '<span class="badge '+(miss?'no':'ok')+'">'+(miss? miss+' hari tak hantar' : 'Lengkap')+'</span></div>';
    });
    el.innerHTML = html || '<div class="msg">Tiada guru dijumpai.</div>';
  }

  function openReport(i){ go({ v:'report', guru:GURU[i] }); }

  // ---------- Laporan seorang guru ----------
  function renderReport(){
    var g = view.guru, s = guruStats(g, ym), tk = todayKey();
    document.getElementById('title').textContent = 'Laporan RPH Guru';
    var gi = GURU.indexOf(g);
    var grid = gridHtml(function(k, d){
      var today = k===tk ? ' today' : '';
      if (SUM[k] && SUM[k][g]) {
        return '<div class="day ok'+today+'" onclick="go({v:\'detail\',key:\''+k+'\',guru:GURU['+gi+']})">'+d+'<small>'+SUM[k][g].length+' RPH</small></div>';
      }
      if (s.miss.indexOf(k) >= 0) return '<div class="day no'+today+'">'+d+'<small>Tiada</small></div>';
      return '<div class="day'+today+'">'+d+'</div>';
    });

    var html = '<div class="wrap"><div class="crumb"><b style="color:var(--tx);font-size:17px">'+esc(g)+'</b></div>'
      + '<div class="stats">'
      + '<div class="stat"><b>'+s.sd.length+'</b><span>Hari sekolah</span></div>'
      + '<div class="stat ok"><b>'+s.sent.length+'</b><span>Hari hantar</span></div>'
      + '<div class="stat no"><b>'+s.miss.length+'</b><span>Hari tak hantar</span></div>'
      + '</div>'
      + '<div class="cal">' + monthHead() + grid
      + '<div class="legend"><span><i style="background:var(--ok2);border:1px solid var(--ok)"></i>Hantar</span>'
      + '<span><i style="background:var(--no2);border:1px solid var(--no)"></i>Tak hantar</span>'
      + '<span><i style="background:#eee"></i>Cuti / hujung minggu / belum tiba</span></div>'
      + '<div class="summary">'+s.rph+' RPH dihantar dalam '+monthLabel(ym)+'</div></div>';

    html += '<h3>Hari tak hantar ('+s.miss.length+')</h3>';
    html += s.miss.length ? '<div class="chips">' + s.miss.map(function(k){ return '<span class="chip">'+dayName(k)+' '+niceDate(k)+'</span>'; }).join('') + '</div>'
                          : '<p class="note">Tiada — semua hari sekolah ada RPH. 👍</p>';

    var mine = Object.keys(SUM).filter(function(k){ return k.slice(0,7)===ym && SUM[k][g]; }).sort().reverse();
    html += '<h3>Semua RPH '+monthLabel(ym)+' ('+s.rph+')</h3><div class="list">';
    mine.forEach(function(k){
      html += '<div class="item" onclick="go({v:\'detail\',key:\''+k+'\',guru:GURU['+gi+']})"><div><div>'+dayName(k)+', '+niceDate(k)+'</div></div><span class="badge">'+SUM[k][g].length+' RPH</span></div>';
    });
    if (!mine.length) html += '<div class="item static"><span class="sub">Tiada RPH bulan ini.</span></div>';
    html += '</div><p class="note">Hari sekolah dikira Isnin–Jumaat yang sudah berlalu dan ada sekurang-kurangnya seorang guru hantar RPH (hari tanpa sebarang RPH dianggap cuti).</p></div>';
    app.innerHTML = html;
  }

  // ---------- Senarai guru pada satu tarikh ----------
  function renderGurus(){
    document.getElementById('title').textContent = 'Semakan RPH Serenia';
    var day = SUM[view.key];
    var html = '<div class="crumb">Tarikh: <b>'+dayName(view.key)+', '+niceDate(view.key)+'</b></div><div class="list">';
    Object.keys(day).sort().forEach(function(n){
      html += '<div class="item" onclick="go({v:\'detail\',key:\''+view.key+'\',guru:GURU['+GURU.indexOf(n)+']})"><span>'+esc(n)+'</span><span class="badge">'+day[n].length+'</span></div>';
    });
    app.innerHTML = html + '</div>';
  }

  // ---------- Butiran RPH ----------
  function renderDetail(){
    var rows = SUM[view.key][view.guru];
    var head = '<div class="crumb">'+niceDate(view.key)+' › <b>'+esc(view.guru)+'</b> ('+rows.length+' RPH)</div>';
    var ck = rows.join(','), me = view;
    var show = function(d){
      if (view !== me) return;
      var html = head;
      d.rows.forEach(function(r){
        html += '<div class="entry">';
        d.headers.forEach(function(h,i){
          var v = r[i]; if (v === '' || !h) return;
          html += '<div class="f"><b>'+esc(h)+'</b><div>'+linkify(v)+'</div></div>';
        });
        html += '</div>';
      });
      app.innerHTML = html;
    };
    if (DETAIL[ck]) return show(DETAIL[ck]);
    app.innerHTML = head + '<div class="msg">Memuatkan butiran…</div>';
    api('api=rows&r=' + ck).then(function(d){ DETAIL[ck] = d; show(d); }).catch(err);
  }

  load(false);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
